<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>tràielts - Portal Quản Lý Lịch Dạy & Học Viên</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const TIME_INTERVALS = [
      '07:00', '07:20', '07:40',
      '08:00', '08:20', '08:40', '09:00', '09:20', '09:40',
      '10:00', '10:20', '10:40', '11:00', '11:20', '11:40',
      '12:00', '12:20', '12:40', '13:00', '13:20', '13:40',
      '14:00', '14:20', '14:40', '15:00', '15:20', '15:40',
      '16:00', '16:20', '16:40', '17:00', '17:20', '17:40',
      '18:00', '18:20', '18:40', '19:00', '19:20', '19:40',
      '20:00', '20:20', '20:40', '21:00', '21:20', '21:40',
      '22:00', '22:20', '22:40'
    ];

    const DAYS = ['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'Chủ Nhật'];
    const TEACHERS_LIST = ['Hà', 'Giang', 'My', 'Trà', 'Chanh', 'Khoa'];

    const MONTHS_LIST = [
      { key: '2026-06', label: 'Tháng 6/2026', year: 2026, month: 6 },
      { key: '2026-07', label: 'Tháng 7/2026', year: 2026, month: 7 },
      { key: '2026-08', label: 'Tháng 8/2026', year: 2026, month: 8 },
      { key: '2026-09', label: 'Tháng 9/2026', year: 2026, month: 9 },
      { key: '2026-10', label: 'Tháng 10/2026', year: 2026, month: 10 },
      { key: '2026-11', label: 'Tháng 11/2026', year: 2026, month: 11 },
      { key: '2026-12', label: 'Tháng 12/2026', year: 2026, month: 12 },
    ];

    const WEEKS_LIST = ['Tuần 1', 'Tuần 2', 'Tuần 3', 'Tuần 4', 'Tuần 5'];

    const STORAGE_KEY = 'traielts_portal_slots_v2026_final_v1';
    const LOCKED_STORAGE_KEY = 'traielts_portal_locks_v2026_final_v1';
    const TARGET_STORAGE_KEY = 'traielts_portal_targets_v2026_final_v1';

    const calculateEndTime = (startTimeStr, durationMinutes) => {
      const [h, m] = startTimeStr.split(':').map(Number);
      const totalMins = h * 60 + m + durationMinutes;
      const endH = String(Math.floor(totalMins / 60)).padStart(2, '0');
      const endM = String(totalMins % 60).padStart(2, '0');
      return `${endH}:${endM}`;
    };

    const getPreviousMonthKey = (monthKey) => {
      const [y, m] = monthKey.split('-').map(Number);
      let prevY = y;
      let prevM = m - 1;
      if (prevM === 0) {
        prevM = 12;
        prevY -= 1;
      }
      return `${prevY}-${String(prevM).padStart(2, '0')}`;
    };

    const getWeekDaysWithDates = (monthKey, weekName) => {
      const monthObj = MONTHS_LIST.find(m => m.key === monthKey) || MONTHS_LIST[1];
      const weekIndex = WEEKS_LIST.indexOf(weekName);
      const safeWeekIdx = weekIndex >= 0 ? weekIndex : 0;

      const firstDayOfMonth = new Date(monthObj.year, monthObj.month - 1, 1);
      const dayOfWeek = firstDayOfMonth.getDay();
      const diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      
      const firstMonday = new Date(firstDayOfMonth);
      firstMonday.setDate(firstMonday.getDate() + diffToMonday);

      const targetMonday = new Date(firstMonday);
      targetMonday.setDate(targetMonday.getDate() + safeWeekIdx * 7);

      const days = DAYS.map((dayName, idx) => {
        const d = new Date(targetMonday);
        d.setDate(targetMonday.getDate() + idx);
        const dayNum = String(d.getDate()).padStart(2, '0');
        const monthNum = String(d.getMonth() + 1).padStart(2, '0');
        const yearNum = d.getFullYear();
        const isoDate = `${yearNum}-${monthNum}-${dayNum}`;
        return {
          name: dayName,
          dayNum,
          monthNum,
          yearNum,
          isoDate,
          dateFormatted: `${dayNum}/${monthNum}`,
          headerLabel: `${dayName} (${dayNum}/${monthNum})`
        };
      });

      const firstDay = days[0];
      const lastDay = days[6];
      const rangeStr = `Từ ${firstDay.dateFormatted} đến ${lastDay.dateFormatted}/${firstDay.yearNum}`;

      return { days, rangeStr, monthTitle: monthObj.label };
    };

    const getWeekRangeForWeek = (monthKey, weekName) => {
      const { days } = getWeekDaysWithDates(monthKey, weekName);
      return `${days[0].dateFormatted} - ${days[6].dateFormatted}`;
    };

    const getCurrentMonthKey = () => {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      return `${year}-${month}`;
    };

    const getCurrentWeekName = () => {
      const now = new Date();
      const monthKey = getCurrentMonthKey();
      const monthObj = MONTHS_LIST.find(m => m.key === monthKey) || { year: now.getFullYear(), month: now.getMonth() + 1 };
      const firstDayOfMonth = new Date(monthObj.year, monthObj.month - 1, 1);
      const dayOfWeek = firstDayOfMonth.getDay();
      const diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      const firstMonday = new Date(firstDayOfMonth);
      firstMonday.setDate(firstMonday.getDate() + diffToMonday);

      const diffDays = Math.floor((now - firstMonday) / (1000 * 60 * 60 * 24));
      const weekIdx = Math.max(0, Math.min(4, Math.floor(diffDays / 7)));
      return WEEKS_LIST[weekIdx];
    };

    const getBlocksForDuration = (startTime, durationMinutes) => {
      const blocksCount = Math.ceil(durationMinutes / 20);
      const idx = TIME_INTERVALS.indexOf(startTime);
      if (idx === -1) return [startTime];
      const result = [];
      for (let i = 0; i < blocksCount; i++) {
        if (idx + i < TIME_INTERVALS.length) {
          result.push(TIME_INTERVALS[idx + i]);
        }
      }
      return result;
    };

    const INITIAL_SLOTS = [];

    function App() {
      const [userRole, setUserRole] = useState('teacher'); // 'teacher' | 'sales' | 'cs'
      const [userId, setUserId] = useState('Hà');
      const [isLoggedIn, setIsLoggedIn] = useState(false);

      const [view, setView] = useState('register_cal');
      const [selectedMonthKey, setSelectedMonthKey] = useState('2026-07');
      const [selectedWeek, setSelectedWeek] = useState('Tuần 1');
      const [selectedTeacherForSales, setSelectedTeacherForSales] = useState('Hà');
      
      const [weeklyTargetOverrides, setWeeklyTargetOverrides] = useState(() => {
        const saved = localStorage.getItem(TARGET_STORAGE_KEY);
        if (saved) return JSON.parse(saved);
        const defaults = {};
        MONTHS_LIST.forEach(m => {
          TEACHERS_LIST.forEach(gv => {
            WEEKS_LIST.forEach(w => {
              defaults[`${m.key}_${gv}_${w}`] = 28; // Mặc định mỗi tuần 28 ca[cite: 2]
            });
          });
        });
        return defaults;
      });

      const [slots, setSlots] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : INITIAL_SLOTS;
      });

      const [lockedMonths, setLockedMonths] = useState(() => {
        const saved = localStorage.getItem(LOCKED_STORAGE_KEY);
        return saved ? JSON.parse(saved) : {};
      });

      const [toastMsg, setToastMsg] = useState('');
      const [isModalOpen, setIsModalOpen] = useState(false);

      const [activeGCalSlot, setActiveGCalSlot] = useState(null);
      const [isRescheduleModalOpen, setIsRescheduleModalOpen] = useState(false);
      const [rescheduleDate, setRescheduleDate] = useState('');
      // Lead Capacity Calculator States
      const [isCalculatorOpen, setIsCalculatorOpen] = useState(false);
      const [calcEmptySlotsMode, setCalcEmptySlotsMode] = useState('auto');
      const [calcEmptySlots, setCalcEmptySlots] = useState(46);
      const [calcTeacherMode, setCalcTeacherMode] = useState('manual');
      const [calcNumTeachers, setCalcNumTeachers] = useState(1);
      const [calcCapacityMode, setCalcCapacityMode] = useState('manual_hours');
      const [calcHoursPerTeacher, setCalcHoursPerTeacher] = useState(20);
      const [calcManualSlots, setCalcManualSlots] = useState(30);
      const [calcSlotDuration, setCalcSlotDuration] = useState(40);
      const [calcConversionRate, setCalcConversionRate] = useState(30);
      const [calcMinCourse, setCalcMinCourse] = useState(8);
      const [calcMaxCourse, setCalcMaxCourse] = useState(13);
      const [calcCustomSessions, setCalcCustomSessions] = useState('');
      const [calcTimeUnit, setCalcTimeUnit] = useState('weekly');
      const [calcShowFormula, setCalcShowFormula] = useState(false);

      const calcResults = useMemo(() => {
        const dur = Math.max(1, calcSlotDuration || 40);
        const cr = Math.min(100, Math.max(0.1, calcConversionRate || 30)) / 100;
        const empty = calcEmptySlotsMode === 'auto' ? 46 : Math.max(0, calcEmptySlots || 0);

        let gvSlotsPerWeek = 0;
        if (calcCapacityMode === 'current_reg') {
          gvSlotsPerWeek = 150;
        } else if (calcCapacityMode === 'manual_slots') {
          gvSlotsPerWeek = Math.max(0, calcManualSlots || 0);
        } else {
          const numGv = calcTeacherMode === 'current' ? 5 : Math.max(0, calcNumTeachers || 0);
          gvSlotsPerWeek = Math.round((numGv * Math.max(0, calcHoursPerTeacher || 0) * 60) / dur);
        }

        const totalWeeklySlots = empty + gvSlotsPerWeek;
        const minC = Math.max(1, Math.min(calcMinCourse, calcMaxCourse));
        const maxC = Math.max(minC, calcMaxCourse);
        const avgCourseLength = (minC + maxC) / 2;

        const calcSc = (sessions) => {
          if (sessions <= 0) return { students: 0, initialLeads: 0, avgActiveWeeks: 0, monthlyStudents: 0, monthlyLeads: 0 };
          const std = Math.round((totalWeeklySlots / sessions) * 10) / 10;
          const initialLeads = Math.ceil(std / cr);
          const avgActiveWeeks = Math.round((avgCourseLength / sessions) * 100) / 100;
          const monthlyStudents = Math.round(((totalWeeklySlots * 4.33) / avgCourseLength) * 10) / 10;
          const monthlyLeads = Math.ceil(monthlyStudents / cr);

          const bestMonthlyStudents = Math.round(((totalWeeklySlots * 4.33) / maxC) * 10) / 10;
          const bestMonthlyLeads = Math.ceil(bestMonthlyStudents / cr);
          const worstMonthlyStudents = Math.round(((totalWeeklySlots * 4.33) / minC) * 10) / 10;
          const worstMonthlyLeads = Math.ceil(worstMonthlyStudents / cr);

          return {
            students: std,
            initialLeads,
            avgActiveWeeks,
            monthlyStudents,
            monthlyLeads,
            bestMonthlyStudents,
            bestMonthlyLeads,
            worstMonthlyStudents,
            worstMonthlyLeads,
          };
        };

        const sc1 = calcSc(1);
        const sc2 = calcSc(2);
        const parsedCustom = parseFloat(calcCustomSessions);
        const hasCustom = !isNaN(parsedCustom) && parsedCustom > 0;
        const scCustom = hasCustom ? calcSc(parsedCustom) : null;

        return {
          emptySlots: empty,
          gvSlotsPerWeek,
          totalWeeklySlots,
          avgCourseLength,
          minC,
          maxC,
          sc1,
          sc2,
          scCustom,
          hasCustom,
          parsedCustom,
          grandMonthlyLeadsAvg: sc1.monthlyLeads,
          grandMonthlyLeadsBest: sc1.bestMonthlyLeads,
          grandMonthlyLeadsWorst: sc1.worstMonthlyLeads,
        };
      }, [calcEmptySlotsMode, calcEmptySlots, calcTeacherMode, calcNumTeachers, calcCapacityMode, calcHoursPerTeacher, calcManualSlots, calcSlotDuration, calcConversionRate, calcMinCourse, calcMaxCourse, calcCustomSessions]);

      // Sales Modal Form States
      const [inputAssignTeacher, setInputAssignTeacher] = useState('Hà');
      const [inputStudentName, setInputStudentName] = useState('');
      const [inputStudentCode, setInputStudentCode] = useState('');
      const [inputCourse, setInputCourse] = useState('IELTS Writing Intensive');
      const [inputMeetLink, setInputMeetLink] = useState('https://meet.google.com/new');
      const [inputDuration, setInputDuration] = useState(40);
      const [inputStartDate, setInputStartDate] = useState('2026-07-02');
      const [inputTotalDays, setInputTotalDays] = useState(10);
      const [inputFrequency, setInputFrequency] = useState(2);
      
      const [inputBaseline, setInputBaseline] = useState('5.0');
      const [inputAim, setInputAim] = useState('7.0');
      const [inputExamDate, setInputExamDate] = useState('2026-12-30');
      const [inputStudentNote, setInputStudentNote] = useState('');
      const [inputPaymentStatus, setInputPaymentStatus] = useState('Đã đóng Full');
      const [inputTuitionNote, setInputTuitionNote] = useState('');

      const [inputSlot1Day, setInputSlot1Day] = useState('Thứ 5');
      const [inputSlot1Time, setInputSlot1Time] = useState('08:00');
      const [inputSlot2Day, setInputSlot2Day] = useState('Thứ 2');
      const [inputSlot2Time, setInputSlot2Time] = useState('08:00');

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 2500);
      };

      const handleSaveConfirm = () => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(slots));
        showToast(`💾 Đã lưu & xác nhận dữ liệu thành công!`);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        setIsLoggedIn(true);
        if (userRole === 'sales') setView('sales_portal');
        else if (userRole === 'cs') setView('cs_portal');
        else setView('register_cal');
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
      };

      const weekInfo = useMemo(() => {
        return getWeekDaysWithDates(selectedMonthKey, selectedWeek);
      }, [selectedMonthKey, selectedWeek]);

      const currentTeacherSlots = useMemo(() => {
        const targetGv = userRole === 'teacher' ? userId : selectedTeacherForSales;
        const validIsoDates = weekInfo.days.map(d => d.isoDate);
        return slots.filter(s => s.teacherId === targetGv && validIsoDates.includes(s.dateStr));
      }, [slots, userRole, userId, selectedTeacherForSales, weekInfo]);

      const salesTeacherWeekSlots = useMemo(() => {
        const validIsoDates = weekInfo.days.map(d => d.isoDate);
        return slots.filter(s => s.teacherId === selectedTeacherForSales && validIsoDates.includes(s.dateStr));
      }, [slots, selectedTeacherForSales, weekInfo]);

      const salesAvailableCa = salesTeacherWeekSlots
        .filter(s => s.status === 'available')
        .length * 0.5;

      const salesBookedCa = salesTeacherWeekSlots
        .filter(s => s.status === 'booked' && !s.isSubBlock)
        .reduce((sum, s) => sum + ((s.duration || 40) / 40), 0);

      const teacherWeekSlots = useMemo(() => {
        const targetGv = userId;
        const validIsoDates = weekInfo.days.map(d => d.isoDate);
        return slots.filter(s => s.teacherId === targetGv && validIsoDates.includes(s.dateStr));
      }, [slots, userId, weekInfo]);

      const teacherWeekAvailableCa = teacherWeekSlots
        .filter(s => s.status === 'available')
        .length * 0.5;

      const teacherWeekBookedCa = teacherWeekSlots
        .filter(s => s.status === 'booked' && !s.isSubBlock)
        .reduce((sum, s) => sum + ((s.duration || 40) / 40), 0);

      const teacherMonthSlots = useMemo(() => {
        const targetGv = userId;
        return slots.filter(s => s.teacherId === targetGv && s.monthKey === selectedMonthKey);
      }, [slots, userId, selectedMonthKey]);

      const teacherMonthAvailableCa = teacherMonthSlots
        .filter(s => s.status === 'available')
        .length * 0.5;

      const teacherMonthBookedCa = teacherMonthSlots
        .filter(s => s.status === 'booked' && !s.isSubBlock)
        .reduce((sum, s) => sum + ((s.duration || 40) / 40), 0);

      const teacherMonthCompletedCa = teacherMonthSlots
        .filter(s => s.status === 'booked' && !s.isSubBlock && (s.csStatus === 'completed' || s.lessonStatus === 'completed'))
        .reduce((sum, s) => sum + ((s.duration || 40) / 40), 0);

      const currentMonthTotalCa = teacherMonthAvailableCa + teacherMonthBookedCa;
      const monthBookRatioPct = currentMonthTotalCa > 0 ? Math.round((teacherMonthBookedCa / currentMonthTotalCa) * 100) : 0;

      const currentLockKey = `${userId}_${selectedMonthKey}`;
      const isMonthLocked = !!lockedMonths[currentLockKey];

      const handleLockMonthSchedule = () => {
        const updatedLocks = { ...lockedMonths, [currentLockKey]: true };
        setLockedMonths(updatedLocks);
        localStorage.setItem(LOCKED_STORAGE_KEY, JSON.stringify(updatedLocks));
        showToast(`🔒 Đã khóa lịch đăng ký tháng ${selectedMonthKey}! Không thể chỉnh sửa nữa.`);
      };

      const weeklyKpiData = useMemo(() => {
        const currentGV = userRole === 'teacher' ? userId : selectedTeacherForSales;
        return WEEKS_LIST.slice(0, 4).map(w => {
          const availCount = teacherMonthSlots
            .filter(s => s.week === w && s.status === 'available')
            .length * 0.5;
          const bookedCount = teacherMonthSlots
            .filter(s => s.week === w && s.status === 'booked' && !s.isSubBlock)
            .reduce((sum, s) => sum + ((s.duration || 40) / 40), 0);
          const count = availCount + bookedCount;
          
          const targetKey = `${selectedMonthKey}_${currentGV}_${w}`;
          const target = weeklyTargetOverrides[targetKey] !== undefined ? weeklyTargetOverrides[targetKey] : 28;
          const pct = target > 0 ? Math.round((count / target) * 100) : 0;
          return { week: w, count, target, pct, targetKey };
        });
      }, [teacherMonthSlots, selectedMonthKey, weeklyTargetOverrides, userRole, userId, selectedTeacherForSales]);

      const dynamicMonthlyCommitment = useMemo(() => {
        return weeklyKpiData.reduce((sum, w) => sum + w.target, 0);
      }, [weeklyKpiData]);

      const kpiPercentage = dynamicMonthlyCommitment > 0 ? Math.round((currentMonthTotalCa / dynamicMonthlyCommitment) * 100) : 0;

      const handleUpdateWeeklyTarget = (targetKey, newTargetVal) => {
        const val = Math.max(0, parseInt(newTargetVal) || 0);
        const updated = { ...weeklyTargetOverrides, [targetKey]: val };
        setWeeklyTargetOverrides(updated);
        localStorage.setItem(TARGET_STORAGE_KEY, JSON.stringify(updated));
      };

      const teacherStudentsList = useMemo(() => {
        const targetGv = userId;
        const booked = slots.filter(s => s.teacherId === targetGv && s.status === 'booked' && !s.isSubBlock);
        
        const map = {};
        booked.forEach(s => {
          const code = s.studentCode;
          if (!map[code]) {
            map[code] = {
              studentName: s.studentName,
              studentCode: code,
              course: s.course,
              baseline: s.baseline,
              aim: s.aim,
              examDate: s.examDate,
              studentNote: s.studentNote,
              paymentStatus: s.paymentStatus,
              sessions: []
            };
          }
          map[code].sessions.push(s);
        });

        return Object.values(map).map(st => {
          const total = st.sessions.length;
          const completed = st.sessions.filter(s => s.csStatus === 'completed' || s.lessonStatus === 'completed').length;
          const remaining = total - completed;
          const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
          const isAlmostEnd = remaining <= 2 && total > 0;
          return {
            ...st,
            total,
            completed,
            remaining,
            pct,
            isAlmostEnd
          };
        });
      }, [slots, userId]);

      const handleOpenMeet = (meetUrl, e) => {
        if (e) e.stopPropagation();
        window.open(meetUrl || 'https://meet.google.com/new', '_blank');
      };

      const handleUpdateLessonMeta = (slotId, field, value) => {
        const updated = slots.map(s => {
          if (s.id === slotId || (s.id && s.id.toString() === slotId.toString())) {
            return { ...s, [field]: value };
          }
          return s;
        });
        setSlots(updated);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
        if (activeGCalSlot && activeGCalSlot.id === slotId) {
          setActiveGCalSlot(prev => ({ ...prev, [field]: value }));
        }
      };

      const handleOpenGCalPopup = (slot, e) => {
        if (e) e.stopPropagation();
        setActiveGCalSlot(slot);
      };

      const handleOpenReschedule = () => {
        if (!activeGCalSlot) return;
        setRescheduleDate(activeGCalSlot.dateStr);
        setRescheduleTime(activeGCalSlot.startTimeMain || activeGCalSlot.time);
        setIsRescheduleModalOpen(true);
      };

      const handleConfirmReschedule = (e) => {
        e.preventDefault();
        if (!activeGCalSlot) return;

        const sessionId = activeGCalSlot.id;
        const dur = activeGCalSlot.duration || 40;

        const filteredSlots = slots.filter(s => s.id !== sessionId);

        const newDateObj = new Date(rescheduleDate);
        const year = newDateObj.getFullYear();
        const month = String(newDateObj.getMonth() + 1).padStart(2, '0');
        const dayNum = String(newDateObj.getDate()).padStart(2, '0');
        const newIsoDate = `${year}-${month}-${dayNum}`;
        const newMonthKey = `${year}-${month}`;

        const firstDayOfMonth = new Date(year, newDateObj.getMonth(), 1);
        const dayOfWeek = firstDayOfMonth.getDay();
        const diffToMon = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
        const firstMonday = new Date(firstDayOfMonth);
        firstMonday.setDate(firstMonday.getDate() + diffToMon);
        const diffDays = Math.floor((newDateObj - firstMonday) / (1000 * 60 * 60 * 24));
        const weekIdx = Math.floor(diffDays / 7);
        const safeWeekIdx = Math.max(0, Math.min(weekIdx, WEEKS_LIST.length - 1));
        const newWeekName = WEEKS_LIST[safeWeekIdx];
        const newDayName = DAYS[(newDateObj.getDay() + 6) % 7];

        const blocks = getBlocksForDuration(rescheduleTime, dur);
        const calculatedEnd = calculateEndTime(rescheduleTime, dur);

        let newMovedSlots = [];
        blocks.forEach((t, index) => {
          newMovedSlots.push({
            ...activeGCalSlot,
            dateStr: newIsoDate,
            monthKey: newMonthKey,
            week: newWeekName,
            day: newDayName,
            time: t,
            endTime: calculatedEnd,
            startTimeMain: rescheduleTime,
            isSubBlock: index > 0
          });
        });

        const updatedSlots = [...filteredSlots, ...newMovedSlots];
        setSlots(updatedSlots);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedSlots));
        setIsRescheduleModalOpen(false);
        setActiveGCalSlot(null);
        showToast(`📅 Đã dời lịch thành công sang ${rescheduleDate} lúc ${rescheduleTime}!`);
      };

      const handleDragStart = (e, slot) => {
        e.dataTransfer.setData('text/plain', JSON.stringify({
          id: slot.id,
          teacherId: slot.teacherId,
          status: slot.status,
          duration: slot.duration || 20
        }));
      };

      const handleDragOver = (e) => {
        e.preventDefault();
      };

      const handleDrop = (e, targetDayObj, targetTime) => {
        e.preventDefault();
        const rawData = e.dataTransfer.getData('text/plain');
        if (!rawData) return;

        try {
          const draggedInfo = JSON.parse(rawData);
          const targetTeacher = userRole === 'teacher' ? userId : selectedTeacherForSales;

          if (draggedInfo.status === 'available') {
            const dur = draggedInfo.duration || 20;
            const blocks = getBlocksForDuration(targetTime, dur);

            const isLocked = blocks.some(t => {
              const s = slots.find(item => item.teacherId === targetTeacher && item.dateStr === targetDayObj.isoDate && item.time === t);
              return s?.status === 'booked';
            });

            if (isLocked) {
              showToast('🔒 Khung giờ đích đã có học viên đăng ký!');
              return;
            }

            const filtered = slots.filter(s => s.id !== draggedInfo.id && !(s.teacherId === targetTeacher && s.dateStr === targetDayObj.isoDate && blocks.includes(s.time)));
            const newAvailSlots = blocks.map(t => ({
              id: `avail_${Date.now()}_${Math.random()}`,
              teacherId: targetTeacher,
              dateStr: targetDayObj.isoDate,
              monthKey: selectedMonthKey,
              week: selectedWeek,
              day: targetDayObj.name,
              time: t,
              status: 'available',
              duration: dur,
              isSubBlock: false
            }));

            const updated = [...filtered, ...newAvailSlots];
            setSlots(updated);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
            showToast('✨ Đã di chuyển ca rảnh thành công!');

          } else if (draggedInfo.status === 'booked') {
            const slotToMove = slots.find(s => s.id === draggedInfo.id);
            if (!slotToMove) return;

            const dur = slotToMove.duration || 40;
            const filteredSlots = slots.filter(s => s.id !== draggedInfo.id);

            const year = targetDayObj.yearNum;
            const month = targetDayObj.monthNum;
            const newIsoDate = targetDayObj.isoDate;
            const newMonthKey = `${year}-${month}`;

            const firstDayOfMonth = new Date(year, targetDayObj.monthNum - 1, 1);
            const dayOfWeek = firstDayOfMonth.getDay();
            const diffToMon = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            const firstMonday = new Date(firstDayOfMonth);
            firstMonday.setDate(firstMonday.getDate() + diffToMon);
            const diffDays = Math.floor((new Date(newIsoDate) - firstMonday) / (1000 * 60 * 60 * 24));
            const weekIdx = Math.floor(diffDays / 7);
            const safeWeekIdx = Math.max(0, Math.min(weekIdx, WEEKS_LIST.length - 1));
            const newWeekName = WEEKS_LIST[safeWeekIdx];
            const newDayName = targetDayObj.name;

            const blocks = getBlocksForDuration(targetTime, dur);
            const calculatedEnd = calculateEndTime(targetTime, dur);

            let newMovedSlots = [];
            blocks.forEach((t, index) => {
              newMovedSlots.push({
                ...slotToMove,
                dateStr: newIsoDate,
                monthKey: newMonthKey,
                week: newWeekName,
                day: newDayName,
                time: t,
                endTime: calculatedEnd,
                startTimeMain: targetTime,
                isSubBlock: index > 0
              });
            });

            const updated = [...filteredSlots, ...newMovedSlots];
            setSlots(updated);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
            showToast(`📅 Đã kéo thả dời lịch sang ${targetDayObj.headerLabel} lúc ${targetTime}!`);
          }
        } catch (err) {
          console.error(err);
        }
      };

      const handleToggleTeacherSlot = (dayObj, time) => {
        if (isMonthLocked) {
          showToast('🔒 Lịch tháng này đã được khóa và lưu! Không thể chỉnh sửa thêm.');
          return;
        }

        const blocks = getBlocksForDuration(time, teacherDefaultDuration);
        const currentGV = userId;

        const isLocked = blocks.some(t => {
          const s = slots.find(item => item.teacherId === currentGV && item.dateStr === dayObj.isoDate && item.time === t);
          return s?.status === 'booked';
        });

        if (isLocked) {
          showToast('🔒 Khung giờ này đã có học viên đăng ký!');
          return;
        }

        const isAllOpened = blocks.every(t => {
          return slots.some(item => item.teacherId === currentGV && item.dateStr === dayObj.isoDate && item.time === t && item.status === 'available');
        });

        let updatedSlots;
        if (isAllOpened) {
          updatedSlots = slots.filter(s => !(s.teacherId === currentGV && s.dateStr === dayObj.isoDate && blocks.includes(s.time)));
        } else {
          const newSlotsToAdd = blocks.map(t => ({
            id: `avail_${Date.now()}_${Math.random()}`,
            teacherId: currentGV,
            dateStr: dayObj.isoDate,
            monthKey: selectedMonthKey,
            week: selectedWeek,
            day: dayObj.name,
            time: t,
            status: 'available',
            duration: teacherDefaultDuration,
            isSubBlock: false
          }));
          updatedSlots = [...slots.filter(s => !(s.teacherId === currentGV && s.dateStr === dayObj.isoDate && blocks.includes(s.time))), ...newSlotsToAdd];
        }

        setSlots(updatedSlots);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedSlots));
      };

      const handleConfirmSalesAssign = (e) => {
        e.preventDefault();
        if (!inputStudentName.trim() || !inputStudentCode.trim()) return;

        const totalSessions = Math.max(1, parseInt(inputTotalDays) || 1);
        const assignedTeacher = inputAssignTeacher;
        const freq = parseInt(inputFrequency) || 1;
        const dur = parseInt(inputDuration) || 40;

        let scheduleConfigs = [
          { day: inputSlot1Day, time: inputSlot1Time },
          { day: inputSlot2Day, time: inputSlot2Time }
        ].slice(0, freq);

        let newBookedSlots = [];
        const startDateObj = new Date(inputStartDate);
        
        let currentDate = new Date(startDateObj);
        let collectedSessions = 0;
        let safetyCounter = 0;

        while (collectedSessions < totalSessions && safetyCounter < 150) {
          safetyCounter++;
          const currentDayName = DAYS[(currentDate.getDay() + 6) % 7];

          let sessionTime = inputSlot1Time;
          let shouldBook = false;

          if (collectedSessions === 0) {
            currentDate = new Date(startDateObj);
            shouldBook = true;
          } else {
            const matchedConfig = scheduleConfigs.find(c => c.day === currentDayName);
            if (matchedConfig) {
              sessionTime = matchedConfig.time;
              shouldBook = true;
            }
          }

          if (shouldBook) {
            const sessionNum = collectedSessions + 1;
            const dayLabelStr = `Day ${sessionNum}/${totalSessions}`;
            const actualDayName = DAYS[(currentDate.getDay() + 6) % 7];
            
            const year = currentDate.getFullYear();
            const month = String(currentDate.getMonth() + 1).padStart(2, '0');
            const dayNum = String(currentDate.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${dayNum}`;
            const monthKey = `${year}-${month}`;

            const firstDayOfMonth = new Date(year, currentDate.getMonth(), 1);
            const dayOfWeek = firstDayOfMonth.getDay();
            const diffToMon = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            const firstMonday = new Date(firstDayOfMonth);
            firstMonday.setDate(firstMonday.getDate() + diffToMon);
            const diffDays = Math.floor((currentDate - firstMonday) / (1000 * 60 * 60 * 24));
            const weekIdx = Math.floor(diffDays / 7);
            const safeWeekIdx = Math.max(0, Math.min(weekIdx, WEEKS_LIST.length - 1));
            const weekName = WEEKS_LIST[safeWeekIdx];

            const blocks = getBlocksForDuration(sessionTime, dur);
            const calculatedEnd = calculateEndTime(sessionTime, dur);

            const uniqueSessionId = `slot_${Date.now()}_s${sessionNum}_${Math.random()}`;

            blocks.forEach((t, index) => {
              newBookedSlots.push({
                id: uniqueSessionId,
                teacherId: assignedTeacher,
                dateStr: dateStr,
                monthKey: monthKey,
                week: weekName,
                day: actualDayName,
                time: t,
                endTime: calculatedEnd,
                startTimeMain: sessionTime,
                status: 'booked',
                studentName: inputStudentName,
                studentCode: inputStudentCode,
                course: inputCourse,
                baseline: inputBaseline,
                aim: inputAim,
                examDate: inputExamDate,
                studentNote: inputStudentNote,
                paymentStatus: inputPaymentStatus,
                tuitionNote: inputTuitionNote,
                groupCode: '86',
                dayLabel: dayLabelStr,
                startDate: inputStartDate,
                duration: dur,
                meetLink: inputMeetLink || 'https://meet.google.com/new',
                lessonStatus: '',
                lessonNotes: '',
                csForm: '',
                csStatus: '',
                isSubBlock: index > 0,
                assignedBy: userId
              });
            });

            collectedSessions++;
          }

          currentDate.setDate(currentDate.getDate() + 1);
        }

        const bookedKeys = newBookedSlots.map(b => `${b.dateStr}_${b.time}`);

        const filteredOld = slots.filter(s => {
          if (s.teacherId === assignedTeacher && s.studentCode === inputStudentCode) return false;
          if (s.teacherId === assignedTeacher && s.status === 'available' && bookedKeys.includes(`${s.dateStr}_${s.time}`)) return false;
          return true;
        });

        const updatedSlots = [...filteredOld, ...newBookedSlots];

        setSlots(updatedSlots);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedSlots));

        if (newBookedSlots.length > 0) {
          setSelectedMonthKey(newBookedSlots[0].monthKey);
          setSelectedWeek(newBookedSlots[0].week);
        }

        showToast(`🎉 Xếp thành công ${totalSessions} buổi! (Day 1 xuất hiện đúng ngày ${inputStartDate})`);
        setIsModalOpen(false);
      };

                          </div>
                        </div>
                        <div className="mt-3 flex items-center justify-between rounded-xl bg-slate-50 px-3 py-2 text-xs border border-slate-100">
                          <span className="font-semibold text-slate-600">Học viên cần:</span>
                          <strong className="font-black text-slate-900 font-mono">{calcResults.sc1_5.students} HV</strong>
                        </div>
                      </div>
                    </div>

                    {/* 2 Buổi */}
                    <div className="flex flex-col justify-between gap-4 rounded-3xl border border-purple-200 bg-white p-5 shadow-sm">
                      <div>
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-black uppercase text-slate-900">2 BUỔI / TUẦN</span>
                          <span className="bg-purple-100 text-purple-800 px-2 py-0.5 rounded-full text-[10px] font-extrabold">2 buổi/lead/tuần</span>
                        </div>
                        <div className="mt-4 space-y-1">
                          <span className="text-[10px] font-bold uppercase text-slate-400">Lead Mới Cần {calcTimeUnit === 'weekly' ? '/ Tuần' : '/ Tháng'}</span>
                          <div className="flex items-baseline gap-1">
                            <span className="text-3xl font-black font-mono text-purple-700">
                              {calcTimeUnit === 'weekly' ? calcResults.sc2.leadsWeekly.toLocaleString() : calcResults.sc2.leadsMonthly.toLocaleString()}
                            </span>
                            <span className="text-xs font-extrabold text-slate-500">leads</span>
                          </div>
                        </div>
                        <div className="mt-3 flex items-center justify-between rounded-xl bg-slate-50 px-3 py-2 text-xs border border-slate-100">
                          <span className="font-semibold text-slate-600">Học viên cần:</span>
                          <strong className="font-black text-slate-900 font-mono">{calcResults.sc2.students} HV</strong>
                        </div>
                      </div>
                    </div>

                    {/* Custom Card (if entered) */}
                    {calcResults.hasCustom && calcResults.scCustom && (
                      <div className="flex flex-col justify-between gap-4 rounded-3xl border border-amber-200 bg-white p-5 shadow-sm">
                        <div>
                          <div className="flex items-center justify-between">
                            <span className="text-xs font-black uppercase text-slate-900">{calcResults.parsedCustom} BUỔI / TUẦN</span>
                            <span className="bg-amber-100 text-amber-900 px-2 py-0.5 rounded-full text-[10px] font-extrabold">Tùy chỉnh</span>
                          </div>
                          <div className="mt-4 space-y-1">
                            <span className="text-[10px] font-bold uppercase text-slate-400">Lead Mới Cần {calcTimeUnit === 'weekly' ? '/ Tuần' : '/ Tháng'}</span>
                            <div className="flex items-baseline gap-1">
                              <span className="text-3xl font-black font-mono text-amber-800">
                                {calcTimeUnit === 'weekly' ? calcResults.scCustom.leadsWeekly.toLocaleString() : calcResults.scCustom.leadsMonthly.toLocaleString()}
                              </span>
                              <span className="text-xs font-extrabold text-slate-500">leads</span>
                            </div>
                          </div>
                          <div className="mt-3 flex items-center justify-between rounded-xl bg-slate-50 px-3 py-2 text-xs border border-slate-100">
                            <span className="font-semibold text-slate-600">Học viên cần:</span>
                            <strong className="font-black text-slate-900 font-mono">{calcResults.scCustom.students} HV</strong>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                </div>

                {/* Grand Target Summary Box */}
                <div className="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-5">
                    <div className="space-y-1.5">
                      <div className="flex items-center gap-2">
                        <span className="flex size-7 items-center justify-center rounded-xl bg-amber-500 text-white font-black text-xs">★</span>
                        <h4 className="text-sm font-black uppercase tracking-wider text-slate-900">
                          {calcTimeUnit === 'weekly' ? 'Tổng Hợp Lead Cần / Tuần' : 'Tổng Hợp Lead Cần / Tháng'}
                        </h4>
                        <span className="rounded-full bg-amber-100 text-amber-900 border border-amber-300 px-2 py-0.5 text-[10px] font-extrabold">
                          {calcTimeUnit === 'weekly' ? 'Chu kỳ 7 ngày' : 'Quy đổi 4.33 tuần/tháng'}
                        </span>
                      </div>
                      <p className="text-xs text-slate-500 font-medium">
                        Chỉ tiêu số lượng lead Marketing & Sales cần tạo để lấp đầy 100% capacity giáo viên ({calcResults.totalWeeklySlots} ca/tuần).
                      </p>
                    </div>

                    <div className="flex flex-wrap items-center gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                      <div>
                        <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Khoảng Dao Động (Min – Max)</span>
                        <strong className="text-lg font-black text-slate-900">
                          {calcTimeUnit === 'weekly' ? `${calcResults.minW.toLocaleString()} – ${calcResults.maxW.toLocaleString()}` : `${calcResults.minM.toLocaleString()} – ${calcResults.maxM.toLocaleString()}`}
                        </strong>
                        <span className="text-xs font-semibold text-slate-500 ml-1">leads</span>
                      </div>

                      <div className="h-8 w-px bg-slate-200 hidden sm:block"></div>

                      <div className="bg-emerald-700 text-white px-4 py-2 rounded-xl shadow-xs">
                        <span className="text-[10px] font-extrabold uppercase tracking-wider text-emerald-200 block">Target Trung Bình (~1.5 buổi)</span>
                        <div className="flex items-baseline gap-1">
                          <span className="text-2xl font-black">
                            ~{calcTimeUnit === 'weekly' ? calcResults.avgW.toLocaleString() : calcResults.avgM.toLocaleString()}
                          </span>
                          <span className="text-xs font-bold text-emerald-200">leads / {calcTimeUnit === 'weekly' ? 'tuần' : 'tháng'}</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Formula Explanation */}
                <div className="rounded-2xl border border-slate-200 bg-slate-50/70 p-4 text-xs">
                  <button
                    type="button"
                    onClick={() => setCalcShowFormula(!calcShowFormula)}
                    className="flex w-full items-center justify-between text-left font-extrabold text-slate-700 hover:text-slate-900 cursor-pointer"
                  >
                    <span>💡 Công thức tính & Logic giải thuật (How is this calculated?)</span>
                    <span>{calcShowFormula ? '▲' : '▼'}</span>
                  </button>

                  {calcShowFormula && (
                    <div className="mt-4 space-y-3 border-t border-slate-200/80 pt-3 text-slate-600 leading-relaxed">
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 font-mono text-[11px]">
                        <div className="bg-white p-3 rounded-xl border border-slate-200 space-y-1">
                          <strong className="text-slate-900 block font-sans">A. Tính Capacity Ca Từ Số Giờ Dạy:</strong>
                          <p className="text-emerald-800 font-bold">Số ca/tuần = (Số GV × Giờ dạy/tuần × 60) ÷ Thời lượng 1 ca</p>
                          <p className="text-slate-500">= ({calcNumTeachers} × {calcHoursPerTeacher} × 60) ÷ {calcSlotDuration} = <strong>{calcResults.gvSlotsPerWeek} ca/tuần</strong></p>
                        </div>
                        <div className="bg-white p-3 rounded-xl border border-slate-200 space-y-1">
                          <strong className="text-slate-900 block font-sans">B. Tính Tổng Slot Cần Fill:</strong>
                          <p className="text-blue-700 font-bold">Tổng slot = Slot trống hiện tại + Capacity GV thêm</p>
                          <p className="text-slate-500">= {calcEmptySlots} + {calcResults.gvSlotsPerWeek} = <strong>{calcResults.totalWeeklySlots} ca/tuần</strong></p>
                        </div>
                        <div className="bg-white p-3 rounded-xl border border-slate-200 space-y-1">
                          <strong className="text-slate-900 block font-sans">C. Tính Số Học Viên Cần:</strong>
                          <p className="text-purple-700 font-bold">Học viên cần = Tổng slot ÷ Số buổi/lead/tuần</p>
                          <p className="text-slate-500">Ví dụ (1.5 buổi): {calcResults.totalWeeklySlots} ÷ 1.5 = <strong>{calcResults.sc1_5.students} học viên</strong></p>
                        </div>
                        <div className="bg-white p-3 rounded-xl border border-slate-200 space-y-1">
                          <strong className="text-slate-900 block font-sans">D. Tính Số Lead Mới Cần:</strong>
                          <p className="text-amber-800 font-bold">Lead cần = ⌈ Học viên cần ÷ Conversion Rate ⌉</p>
                          <p className="text-slate-500">Ví dụ (CR {calcConversionRate}%): ⌈ {calcResults.sc1_5.students} ÷ {calcConversionRate}% ⌉ = <strong>{calcResults.sc1_5.leadsWeekly} leads</strong> (làm tròn lên)</p>
                        </div>
                      </div>
                      <p className="text-[11px] text-slate-500 italic">
                        * Quy đổi tháng sử dụng hệ số chuẩn hóa <strong>4.33 tuần / tháng</strong>.
                      </p>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
